# Production: standalone build served by `node server.js`.
#   docker compose -f docker-compose.prod.yml up --build
# NEXT_PUBLIC_API_URL is baked into the client bundle at BUILD time, so it is
# passed as a build arg (not just a runtime env var).
services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://api.escuelasoberana.com
        # From the gitignored .env next to this file (see .env.sentry-build-plugin).
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        # Cloudflare Web Analytics beacon token (from the .env next to this file).
        NEXT_PUBLIC_CF_BEACON_TOKEN: ${NEXT_PUBLIC_CF_BEACON_TOKEN:-}
        # Umami website id (from the .env next to this file).
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    image: soberana-landing:prod
    container_name: soberana-landing-prod
    environment:
      - NODE_ENV=production
    # Cap container logs: Docker's json-file driver is unbounded by default,
    # which is a slow disk-full waiting for real traffic. 100MB ceiling.
    # stdout/stderr is for debugging only — anything that has to survive
    # belongs in the database, not in a log file.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.landing.rule=Host(`escuelasoberana.com`) || Host(`www.escuelasoberana.com`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls.certresolver=le
      - traefik.http.services.landing.loadbalancer.server.port=3000
    restart: unless-stopped

networks:
  web:
    external: true
